name: Bug report
description: Something did not work, wrote the wrong thing, or refused to write
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove usernames and tokens from anything you paste.
        For anything sensitive, use SECURITY.md instead of this form.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The actual behaviour, as plainly as you can put it.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Tick PhotoCraft for VS Code
        2. Press Apply all
        3. See ...
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of `python craftconnect.py --doctor`
      description: Replace personal paths if you prefer, but keep the state markers and reasons.
      render: text
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.13.1"
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Which mode
      options:
        - Headless
        - Attach
        - GUI
        - Not sure
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Relevant config entry
      description: The craft entry only, with any neighbouring secrets removed.
      render: json
